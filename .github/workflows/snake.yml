name: Generate Snake

on:
  schedule:
    # runs automatically every 24 hours
    - cron: "0 0 * * *" 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: Platane/snk@v3
        with:
          github_user_name: anu-deepika
          outputs: |
            outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#E91E63&color_dots=#161b22,#4d081e,#8a0e36,#c7154e,#e91e63
            
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
