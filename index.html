<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Blog</title>
  <style>
    :root {
      --bg: #121012;
      --card-bg: #1a1618;
      --border: #33262b;
      --text-main: #f0e6e8;
      --text-dim: #a39398;
      --accent-pink: #ff4d88;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.6;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 640px;
    }

    header {
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      font-size: 1.8rem;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .bio {
      color: var(--text-dim);
      font-size: 1rem;
    }

    .section-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--accent-pink);
      margin-bottom: 20px;
      font-weight: 700;
    }

    .post-list {
      list-style: none;
    }

    .post-item {
      margin-bottom: 20px;
    }

    .post-link {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      text-decoration: none;
      padding: 14px 16px;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .post-link:hover {
      border-color: var(--accent-pink);
      transform: translateY(-2px);
    }

    .post-title {
      color: #ffffff;
      font-weight: 600;
      font-size: 1.05rem;
    }

    .post-date {
      color: var(--text-dim);
      font-size: 0.85rem;
      white-space: nowrap;
      margin-left: 15px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Personal Logbook</h1>
      <p class="bio">Thoughts on systems, rules, and building things on my own terms.</p>
    </header>

    <main>
      <div class="section-title">Latest Articles</div>
      
      <ul class="post-list">
        <li>
          <a href="posts/unquestioned-games.html" class="post-link">
            <span class="post-title">Playing the Game on Your Own Terms</span>
            <span class="post-date">Aug 22, 2026</span>
          </a>
        </li>
      </ul>
    </main>
  </div>

</body>
</html>
