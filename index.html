<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>usr@ubuntu: ~</title>
  <style>
    :root {
      --bg-color: #0a0004;
      --panel-bg: #11020a;
      --ubuntu-header: #2c001e;
      --ubuntu-header-border: #380c2a;
      --main-pink: #ff2a7a;
      --dim-pink: #881133;
      --glow-color: rgba(255, 42, 122, 0.45);
      --font-stack: 'Ubuntu Mono', 'Courier New', Courier, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--main-pink);
      font-family: var(--font-stack);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-shadow: 0 0 6px var(--glow-color);
    }

    /* CRT Scanline Overlay */
    body::before {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), 
                  linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      z-index: 10;
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
    }

    .terminal-window {
      width: 100%;
      max-width: 760px;
      border: 1px solid var(--ubuntu-header-border);
      border-radius: 6px 6px 4px 4px;
      box-shadow: 0 0 25px rgba(255, 42, 122, 0.2);
      overflow: hidden;
      background-color: var(--panel-bg);
      z-index: 1;
    }

    /* Ubuntu Header Bar */
    .terminal-header {
      background: linear-gradient(180deg, #3c3b37 0%, var(--ubuntu-header) 100%);
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--ubuntu-header-border);
      user-select: none;
    }

    .terminal-title {
      font-size: 0.85rem;
      color: #dfdbd2;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .ubuntu-controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .control-btn {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background-color: #3d3a39;
      color: #dfdbd2;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 10px;
      line-height: 1;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .control-btn.close { background-color: #e95420; color: #fff; }

    .terminal-body {
      padding: 25px;
      line-height: 1.6;
    }

    .prompt { color: #ff5599; font-weight: bold; }
    .command { color: #ffffff; text-shadow: 0 0 5px #ffffff; }

    .output { margin: 10px 0 25px 0; color: #ff85b3; }

    .post-list { list-style: none; }
    .post-item { margin-bottom: 12px; display: flex; gap: 15px; flex-wrap: wrap; }
    .post-date { color: var(--dim-pink); font-size: 0.9rem; }

    .post-link {
      color: var(--main-pink);
      text-decoration: none;
      font-weight: bold;
    }

    .post-link:hover {
      color: #ffffff;
      background-color: var(--dim-pink);
      padding: 0 6px;
      box-shadow: 0 0 10px var(--main-pink);
    }

    .cursor {
      display: inline-block;
      width: 9px;
      height: 17px;
      background-color: var(--main-pink);
      vertical-align: middle;
      box-shadow: 0 0 8px var(--main-pink);
      animation: blink 1s infinite;
    }

    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  </style>
</head>
<body>

  <div class="terminal-window">
    <div class="terminal-header">
      <span class="terminal-title">usr@ubuntu: ~</span>
      <div class="ubuntu-controls">
        <span class="control-btn">—</span>
        <span class="control-btn">□</span>
        <span class="control-btn close">✕</span>
      </div>
    </div>

    <div class="terminal-body">
      <p><span class="prompt">usr@ubuntu:~$</span> <span class="command">cat intro.txt</span></p>
      <p class="output">
        > Welcome to my terminal logbook.<br>
        > Thoughts on systems, life rules, and unconventional paths.
      </p>

      <p><span class="prompt">usr@ubuntu:~$</span> <span class="command">ls -la ./posts</span></p>
      
      <div class="output">
        <ul class="post-list">
          <li class="post-item">
            <span class="post-date">[2026-08-22]</span>
            <a href="posts/unquestioned-games.html" class="post-link">unquestioned-games.html</a>
          </li>
        </ul>
      </div>

      <p><span class="prompt">usr@ubuntu:~$</span> <span class="cursor"></span></p>
    </div>
  </div>

</body>
</html>
