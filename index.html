<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>notes</title>

  <style>
    :root {
      --bg-color: #0c0207;
      --panel-bg: #14040d;
      --header-bg: linear-gradient(180deg, #42082b 0%, #29031a 100%);
      --header-border: #520d36;
      --neon-pink: #ff2a7a;
      --warm-pink: #ff75a0;
      --soft-white: #fff0f5;
      --dim-border: #73123c;
      --glow: rgba(255, 42, 122, 0.35);
      --font-stack: 'Ubuntu Mono', 'Courier New', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--soft-white);
      font-family: var(--font-stack);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(
          rgba(18, 16, 16, 0) 50%,
          rgba(0, 0, 0, 0.25) 50%
        );
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 10;
    }

    .terminal-window {
      width: 100%;
      max-width: 720px;
      border: 1px solid var(--dim-border);
      border-radius: 8px;
      box-shadow: 0 0 30px var(--glow);
      overflow: hidden;
      background-color: var(--panel-bg);
      z-index: 1;
    }

    .terminal-header {
      background: var(--header-bg);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--header-border);
      user-select: none;
    }

    .terminal-title {
      font-size: 0.9rem;
      color: var(--warm-pink);
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .ubuntu-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .control-btn {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background-color: #4a1535;
      color: var(--warm-pink);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 9px;
    }

    .control-btn.close {
      background-color: #e95420;
      color: #fff;
    }

    .terminal-body {
      padding: 30px;
      line-height: 1.7;
    }

    .section-label {
      color: var(--neon-pink);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .post-card {
      display: flex;
      justify-content: space-between;
      align-items: center;

      background-color: rgba(255, 42, 122, 0.04);
      border: 1px solid var(--dim-border);
      border-radius: 6px;

      padding: 14px 18px;
      margin-bottom: 12px;

      text-decoration: none;
      transition: all 0.25s ease;
    }

    .post-card:hover {
      border-color: var(--neon-pink);
      background-color: rgba(255, 42, 122, 0.12);
      transform: translateY(-2px);
      box-shadow: 0 0 15px var(--glow);
    }

    .post-title {
      color: #ffffff;
      font-size: 1rem;
      font-weight: bold;
    }

    .post-date {
      color: #b3597d;
      font-size: 0.8rem;
    }

    .cursor {
      display: inline-block;
      width: 10px;
      height: 18px;
      background-color: var(--neon-pink);
      vertical-align: middle;
      box-shadow: 0 0 8px var(--neon-pink);
      animation: blink 1s infinite;
      margin-top: 15px;
    }

    @keyframes blink {
      0%, 49% {
        opacity: 1;
      }

      50%, 100% {
        opacity: 0;
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      .terminal-body {
        padding: 20px;
      }

      .post-card {
        padding: 12px 14px;
      }
    }
  </style>
</head>

<body>

  <div class="terminal-window">

    <div class="terminal-header">
      <span class="terminal-title">notes</span>

      <div class="ubuntu-controls">
        <span class="control-btn">—</span>
        <span class="control-btn">□</span>
        <span class="control-btn close">✕</span>
      </div>
    </div>

    <div class="terminal-body">

      <div class="section-label">notes/</div>

      <a href="posts/notes.html" class="post-card">
        <span class="post-title">notes</span>
        <span class="post-date">22.08.26</span>
      </a>

      <div>
        <span class="cursor"></span>
      </div>

    </div>
  </div>

</body>
</html>
