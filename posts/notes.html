<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>thoughts — notes</title>

  <style>
    :root {
      --bg-color: #0a0004;
      --panel-bg: #11020a;
      --ubuntu-header: #2c001e;
      --ubuntu-header-border: #380c2a;
      --main-pink: #ff2a7a;
      --dim-pink: #881133;
      --glow-color: rgba(255, 42, 122, 0.45);
      --font-stack: 'Ubuntu Mono', 'Courier New', Courier, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--main-pink);
      font-family: var(--font-stack);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-shadow: 0 0 6px var(--glow-color);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(
          rgba(18, 16, 16, 0) 50%,
          rgba(0, 0, 0, 0.3) 50%
        ),
        linear-gradient(
          90deg,
          rgba(255, 0, 0, 0.03),
          rgba(0, 255, 0, 0.01),
          rgba(0, 0, 255, 0.03)
        );
      z-index: 10;
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
    }

    .terminal-window {
      width: 100%;
      max-width: 800px;
      border: 1px solid var(--ubuntu-header-border);
      border-radius: 6px 6px 4px 4px;
      box-shadow: 0 0 25px rgba(255, 42, 122, 0.2);
      overflow: hidden;
      background-color: var(--panel-bg);
      z-index: 1;
      margin: 20px 0;
    }

    .terminal-header {
      background: linear-gradient(
        180deg,
        #3c3b37 0%,
        var(--ubuntu-header) 100%
      );
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--ubuntu-header-border);
      user-select: none;
    }

    .terminal-title {
      font-size: 0.85rem;
      color: #dfdbd2;
      font-weight: bold;
    }

    .ubuntu-controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .control-btn {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background-color: #3d3a39;
      color: #dfdbd2;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .control-btn.close {
      background-color: #e95420;
      color: #fff;
    }

    .terminal-body {
      padding: 30px;
      line-height: 1.7;
    }

    .top-nav {
      margin-bottom: 28px;
    }

    .top-nav a {
      color: #ff85b3;
      text-decoration: none;
      font-size: 0.85rem;
    }

    .top-nav a:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    .post-title {
      color: #ffffff;
      font-size: 1.5rem;
      margin-bottom: 5px;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
    }

    .post-meta {
      color: var(--dim-pink);
      font-size: 0.85rem;
      margin-bottom: 30px;
    }

    .article-body {
      max-width: 680px;
    }

    .article-body p {
      margin-bottom: 20px;
      color: #ff99be;
      line-height: 1.8;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .terminal-body {
        padding: 22px;
      }

      .post-title {
        font-size: 1.3rem;
      }
    }
  </style>
</head>

<body>

  <div class="terminal-window">

    <div class="terminal-header">
      <span class="terminal-title">thoughts — notes</span>

      <div class="ubuntu-controls">
        <span class="control-btn">—</span>
        <span class="control-btn">□</span>
        <span class="control-btn close">✕</span>
      </div>
    </div>

    <div class="terminal-body">

      <nav class="top-nav">
        <a href="../index.html">← Notes</a>
      </nav>

      <h1 class="post-title">thoughts</h1>

      <div class="post-meta">
        22 August 2026
      </div>

      <div class="article-body">

       
        <p>
          whatever catches that attention, 
          thoughts, observations, questions, ideas, memories, 
          and the occasional rabbit hole.
        </p>

      

      </div>

    </div>
  </div>

</body>
</html>
